name: payayar
description: "Payayaar (پایا‌یار) — local-first study and life planning for exam-preparation students."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.13.4

dependencies:
  drift: ^2.35.0
  file_selector: ^1.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (AGENTS.md §4: lightweight, clearly justified).
  flutter_riverpod: ^2.6.1

  # Persist theme/language preferences locally (local-first, no backend).
  flutter_secure_storage: ^11.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.3.0
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

# Launcher icons generated from the project logo (PLAN.md step 2).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.jpg
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo.jpg
  windows:
    generate: true
    image_path: assets/images/logo.jpg
    icon_size: 256

# gen-l10n entrypoint (fa.arb / en.arb in lib/core/l10n).

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  # Vazirmatn — the maintained distribution of the Vazir family
  # (design.md §8: primary UI font; closest available weights).
  # 300 Light, 400 Regular, 500 Medium, 600 SemiBold, 700 Bold,
  # 800 ExtraBold, 900 Black.
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
  # Shabnam (Farsi-digits build) — user's requested UI font.
  # 100 Thin, 300 Light, 400 Regular, 500 Medium, 700 Bold.
    - family: Shabnam
      fonts:
        - asset: assets/fonts/Shabnam-Thin-FD.ttf
          weight: 100
        - asset: assets/fonts/Shabnam-Light-FD.ttf
          weight: 300
        - asset: assets/fonts/Shabnam-FD.ttf
          weight: 400
        - asset: assets/fonts/Shabnam-Medium-FD.ttf
          weight: 500
        - asset: assets/fonts/Shabnam-Bold-FD.ttf
          weight: 700
