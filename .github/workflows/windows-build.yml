name: Windows Build

# بیلد نسخه ویندوز پایا‌یار و ساخت فایل نصب setup.exe.
# چون فلوتر از لینوکس نمی‌تواند به ویندوز بیلد بزند، این تنها راه خودکار است.
# خروجی: PAYAYAR-Setup-<sha>.exe (نصب‌کننده) + zip نسخهٔ خام.
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
      - 'l10n.yaml'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Setup
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "build\windows\x64\runner\Release\payayar.exe"
          if (!(Test-Path $exe)) { throw "Missing $exe" }
          Get-ChildItem "build\windows\x64\runner\Release" | Format-Table Name, Length

      - name: Locate Inno Setup (ISCC)
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup not found, installing via choco..."
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after install" }
          Write-Host "ISCC: $iscc"
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Compile installer (setup.exe)
        shell: pwsh
        run: |
          $iscc = "${{ steps.inno.outputs.path }}"
          & $iscc "windows\installer\payayar.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          $f = Get-ChildItem "windows\installer\PAYAYAR-Setup-*.exe" | Select-Object -First 1
          if (-not $f) { throw "setup.exe was not produced" }
          Write-Host "Setup: $($f.FullName) ($($f.Length) bytes)"

      - name: Rename artifacts
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0,7)
          $setup = Get-ChildItem "windows\installer\PAYAYAR-Setup-*.exe" | Select-Object -First 1
          Move-Item $setup.FullName "PAYAYAR-Setup-$sha.exe" -Force
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "PAYAYAR-windows-$sha.zip" -Force
          Get-ChildItem PAYAYAR-*.exe, PAYAYAR-*.zip | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PAYAYAR-windows
          path: |
            PAYAYAR-Setup-*.exe
            PAYAYAR-windows-*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Publish to Release (main only)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = $env:GITHUB_SHA.Substring(0,7)
          $tag = "windows-build-$sha"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag PAYAYAR-Setup-*.exe PAYAYAR-windows-*.zip --clobber
          } else {
            gh release create $tag PAYAYAR-Setup-*.exe PAYAYAR-windows-*.zip --title "PAYAYAR Windows $sha" --notes "نسخه ویندوز از کامیت $sha - فایل نصب: PAYAYAR-Setup"
          }
